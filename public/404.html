<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>الصفحة غير موجودة | جمعية الأسرة السعيدة</title>
    <style>
      :root {
        color-scheme: light;
        --navy: #0b3f73;
        --green: #4e9b3e;
        --ink: #12314f;
        --ink-3: #66788a;
        --cream: #fbf6ee;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--cream);
        color: var(--ink);
        font-family: 'Tajawal', system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      main {
        max-width: 34rem;
      }
      .mark {
        font-size: 4rem;
        font-weight: 800;
        color: var(--green);
        line-height: 1;
      }
      h1 {
        margin: 0.5rem 0 0.6rem;
        color: var(--navy);
        font-size: clamp(1.5rem, 5vw, 2rem);
      }
      p {
        margin: 0 0 1.4rem;
        color: var(--ink-3);
        line-height: 1.8;
      }
      a {
        display: inline-block;
        padding: 0.7rem 1.2rem;
        border-radius: 999px;
        background: var(--navy);
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">404</div>
      <h1>الصفحة غير موجودة</h1>
      <p>الرابط الذي تحاول فتحه غير موجود أو تم نقله.</p>
      <a href="/">العودة إلى الصفحة الرئيسية</a>
    </main>
  </body>
</html>
